name: ${APP_NAME:-qcon-guide}
services:
  app:
    build:
      context: .
      target: builder

    command: ["serve", "--dev-addr=0.0.0.0:8080"]

    environment:
      - DEBUG=true
      - CI=false

    volumes:
      - ./docs:/app/docs
      - ./zensical.toml:/app/zensical.toml

    ports:
      - "8080:8080"
